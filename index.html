<style>
:root{--bg:#030305;--ink:#ece8f4;--mute:#8d89a0;--line:#1c1b26;--panel:#0a0910;--accent:#ff7a2f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body[data-room=burn]{--accent:#ff7a2f}body[data-room=smash]{--accent:#7cc8ff}body[data-room=pop]{--accent:#d86bff}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 55% at 50% 108%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 70%)}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px}
.brand{display:flex;align-items:center;gap:10px}
.breath{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:breath 5s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.35);opacity:1}}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.5px}
#snd{background:none;border:1px solid var(--line);color:var(--ink);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:6px 18px 12px;display:flex;flex-direction:column}
.room{display:none;flex-direction:column;flex:1;gap:12px;animation:in .35s ease}
.room.on{display:flex}
@keyframes in{from{opacity:0}to{opacity:1}}
h2{margin:8px 0 0;font-size:28px;font-weight:900}
.sub{margin:0;color:var(--mute);font-size:14px;line-height:1.7;max-width:46ch}
.cta{align-self:stretch;border:0;border-radius:14px;padding:14px;font:800 18px 'Cairo',sans-serif;background:var(--accent);color:#14070a;cursor:pointer;transition:transform .1s,opacity .2s}
.cta:active{transform:scale(.97)}.cta:disabled{opacity:.35;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px 20px;font:600 15px 'Cairo',sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{min-height:22px;margin:0;font-size:13px;color:var(--mute);text-align:center}
.stage{--b:-.06;position:relative;flex:1;min-height:200px;max-height:420px;display:flex}
.paper{flex:1;position:relative;border-radius:5px 5px 12px 12px;background:repeating-linear-gradient(transparent 0 33px,#0001 33px 34px),linear-gradient(#f7f3e9,#ece6d5);background-position:0 18px,0 0;box-shadow:0 12px 40px #000a;-webkit-mask-image:linear-gradient(to top,transparent calc(var(--b)*100%),#000 calc(var(--b)*100% + 4%));mask-image:linear-gradient(to top,transparent calc(var(--b)*100%),#000 calc(var(--b)*100% + 4%))}
.edge{position:absolute;left:0;right:0;bottom:calc(var(--b)*100%);height:28px;transform:translateY(50%);z-index:2;pointer-events:none;opacity:0;background:linear-gradient(transparent,#1a0a04 30%,#ff5a14 48%,#ffd35a 54%,transparent);filter:blur(2.5px);transition:opacity .3s}
.stage.burning .edge{opacity:1}
@keyframes glow{from{box-shadow:0 0 30px #ff5a1422}to{box-shadow:0 0 70px #ff7a2f55}}
textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#22202a;font:500 20px/34px 'Cairo',sans-serif;padding:18px;direction:rtl;text-align:right;user-select:text;-webkit-user-select:text;border-radius:20px}
textarea::placeholder{color:#9a968a}
.paper.burning textarea::placeholder{color:transparent}
textarea.gone{visibility:hidden}
.after{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.after[hidden]{display:none}
.after p{margin:0;font-size:21px;font-weight:600;line-height:1.8;max-width:22ch;animation:in 1.4s ease}
.count{display:flex;align-items:baseline;gap:10px}
.count span{font-size:56px;font-weight:900;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.count small{color:var(--mute);font-size:15px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.item{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;color:var(--ink);font:600 14px 'Cairo',sans-serif;cursor:pointer;touch-action:manipulation}
.item span{font-size:clamp(46px,16vw,78px);line-height:1;pointer-events:none}
.item b{font-weight:600;pointer-events:none}
.item.hit{animation:jolt .22s ease-out;border-color:var(--accent)}
@keyframes jolt{0%{transform:scale(1)}30%{transform:scale(.84) rotate(var(--r,5deg))}100%{transform:scale(1)}}
.shake{animation:shake .34s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(calc(var(--s)*-1px),calc(var(--s)*.7px))}35%{transform:translate(calc(var(--s)*1px),calc(var(--s)*-.9px))}55%{transform:translate(calc(var(--s)*-.7px),calc(var(--s)*-.5px))}75%{transform:translate(calc(var(--s)*.6px),calc(var(--s)*.8px))}}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;touch-action:none;padding:4px;flex:1;min-height:0;overflow:hidden;align-content:start}
.bubble{aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 32% 28%,#fffa 0 6%,transparent 20%),radial-gradient(circle at 50% 55%,hsl(var(--h) 95% 64%),hsl(var(--h) 90% 38%) 72%,hsl(var(--h) 90% 22%));box-shadow:0 0 16px hsl(var(--h) 95% 55% / .45),inset 0 -5px 10px #0006;transition:transform .1s}
.bubble:active{transform:scale(.9)}
.bubble.popped{background:radial-gradient(circle at 50% 62%,#000c,transparent 72%),#0a0910;box-shadow:inset 0 3px 6px #000,inset 0 -1px 0 #ffffff12;transform:scale(.74);pointer-events:none;transition:transform .2s}
.bubble.grow{animation:grow .4s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*12ms)}
@keyframes grow{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
nav{display:flex;gap:8px;padding:10px 14px 14px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;background:transparent;border:1px solid var(--line);border-radius:16px;color:var(--mute);font:600 13px 'Cairo',sans-serif;cursor:pointer;transition:all .25s}
nav button span{font-size:22px}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media(prefers-reduced-motion:reduce){.shake,.breath,.paper.burning{animation:none}}
</style>
</head>
<body data-room="burn">
<div id="app">
  <header>
    <div class="brand"><span class="breath"></span><h1>مُتَنَفَّس</h1></div>
    <button id="snd" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
  </header>
  <main>
    <section class="room on" id="r-burn">
      <h2>محرقة الهموم</h2>
      <p class="sub">اكتب أثقل ما في رأسك. النص يبقى على جهازك فقط ولا يُحفظ ولا يُرسل.</p>
      <div class="stage" id="stage"><div class="edge"></div><div class="paper" id="paper">
        <textarea id="ta" placeholder="ما الذي يثقل صدرك الآن؟" maxlength="1200" spellcheck="false"></textarea></div>
        <div class="after" id="after" hidden><p id="msg"></p><button class="ghost" id="again">همٌّ آخر</button></div>
      </div>
      <button class="cta" id="burn">احرق الهموم 🔥</button>
      <p class="note" id="note" aria-live="polite"></p>
    </section>
    <section class="room" id="r-smash">
      <h2>غرفة التكسير السريع</h2>
      <p class="sub">اختر شيئاً واضربه. بقوة وبسرعة وبلا حدود.</p>
      <div class="count"><span id="sc">٠</span><small>ضربة فُرِّغت</small></div>
      <p class="note" id="smsg" aria-live="polite">ابدأ بأي شيء تحبه.</p>
      <div class="items" id="items">
        <button class="item" data-m="glass"><span>🥛</span><b>كوب زجاج</b></button>
        <button class="item" data-m="wood"><span>🪵</span><b>لوح خشب</b></button>
        <button class="item" data-m="brick"><span>🧱</span><b>قالب طوب</b></button>
      </div>
    </section>
    <section class="room" id="r-pop">
      <h2>فقاعات التوتر</h2>
      <p class="sub">اضغط أو اسحب إصبعك فوق الفقاعات لتفجيرها بإيقاعك.</p>
      <div class="count"><span id="pc">٠</span><small>فقاعة انفجرت</small></div>
      <div class="grid" id="grid"></div>
      <p class="note" id="pmsg" aria-live="polite"></p>
      <button class="cta" id="refill">انفخ من جديد</button>
    </section>
  </main>
  <nav role="tablist" aria-label="الغرف">
    <button role="tab" data-r="burn" aria-selected="true"><span>🔥</span>المحرقة</button>
    <button role="tab" data-r="smash" aria-selected="false"><span>🥛</span>التكسير</button>
    <button role="tab" data-r="pop" aria-selected="false"><span>🫧</span>الفقاعات</button>
  </nav>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var rnd=Math.random;
var ar=function(n){return n.toLocaleString('ar-EG')};
var vib=function(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- Audio (all synthesized) ---------- */
var AC,master,rev,nb,muted=false,PENT=[523,587,659,784,880];
function audio(){
  if(!AC){
    var C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    AC=new C(); master=AC.createGain(); master.gain.value=muted?0:.85; master.connect(AC.destination);
    var cvv=AC.createConvolver(), rn=(AC.sampleRate*1.6)|0, ib=AC.createBuffer(2,rn,AC.sampleRate);
    for(var c=0;c<2;c++){var dd=ib.getChannelData(c);for(var j=0;j<rn;j++)dd[j]=(rnd()*2-1)*Math.pow(1-j/rn,3.2)}
    cvv.buffer=ib; rev=AC.createGain(); rev.gain.value=.26; rev.connect(cvv); cvv.connect(master);
    nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    var d=nb.getChannelData(0); for(var i=0;i<d.length;i++)d[i]=rnd()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
  if(typeof loadSamples==='function')loadSamples();
  return AC;
}
function nz(dt,dur,type,f,q,g,at){
  if(!audio())return; at=at||.002;
  var t=AC.currentTime+dt, s=AC.createBufferSource(), fl=AC.createBiquadFilter(), ga=AC.createGain();
  s.buffer=nb; fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  ga.gain.setValueAtTime(.0001,t); ga.gain.linearRampToValueAtTime(g,t+at); ga.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl); fl.connect(ga); ga.connect(master); ga.connect(rev); s.start(t,rnd()*1.4); s.stop(t+dur+.05);
}
function tn(dt,type,f1,f2,dur,g){
  if(!audio())return;
  var t=AC.currentTime+dt, o=AC.createOscillator(), ga=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  ga.gain.setValueAtTime(g,t); ga.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(ga); ga.connect(master); ga.connect(rev); o.start(t); o.stop(t+dur+.02);
}
function crackle(){nz(0,.015+rnd()*.03,'bandpass',1200+rnd()*4200,2.5,.12+rnd()*.25)}
function fireSynth(dur){
  if(!audio())return;
  var t=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=nb; s.loop=true; f.type='lowpass'; f.frequency.value=1100;
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.16,t+1.8); g.gain.linearRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.1);
  var end=performance.now()+dur*1000;
  var id=setInterval(function(){
    var k=(end-performance.now())/(dur*1000);
    if(k<=0){clearInterval(id);return}
    var peak=Math.sin(Math.min(1,(1-k))*Math.PI), n=rnd()<peak*.9?(rnd()<.4?2:1):0;
    for(var i=0;i<n;i++)crackle();
  },45);
}
function sGlassSynth(){
  nz(0,.04,'bandpass',5200,1,.7); nz(0,.55,'highpass',3800,.7,.45);
  for(var i=0;i<10;i++){var f=2400+rnd()*4600; tn(rnd()*.38,'sine',f,f*.92,.12+rnd()*.25,.07)}
}
function sWoodSynth(){
  tn(0,'triangle',220,55,.2,.7); nz(0,.25,'bandpass',750,.8,.8,.001);
  for(var i=0;i<5;i++)nz(.02+rnd()*.16,.03,'bandpass',1200+rnd()*1800,3,.35);
}
function sBrickSynth(){
  tn(0,'sine',120,32,.5,.95); nz(0,.5,'lowpass',900,.7,.7,.001); nz(0,.08,'bandpass',2200,1,.4);
  for(var i=0;i<7;i++)nz(.06+rnd()*.4,.04,'bandpass',350+rnd()*900,2,.3);
}
function sPopSynth(){
  var f=PENT[(rnd()*5)|0]; tn(0,'sine',f*1.6,f*.5,.09,.5); nz(0,.035,'highpass',2500,.7,.4);
}
/* realistic layered sounds (override the simple versions above) */
function crackle(){
  var big=rnd()<.12, g=big?.55:.1+rnd()*.25, f=big?900+rnd()*900:1800+rnd()*5000;
  nz(0,.006+rnd()*.012,'bandpass',f,big?1.2:3,g,.0008);
  if(big)nz(.004,.05+rnd()*.05,'lowpass',700+rnd()*500,.7,.3,.001);
  if(rnd()<.3)nz(.012+rnd()*.03,.008,'bandpass',f*1.4,3,g*.5,.0008);
}
function fireSynth(dur){
  if(!audio())return; var t=AC.currentTime;
  function bed(type,f,q,gp,rate,depth){
    var s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),o=AC.createOscillator(),lg=AC.createGain();
    s.buffer=nb; s.loop=true; fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(gp,t+1.5); g.gain.setValueAtTime(gp,t+dur-2.2); g.gain.linearRampToValueAtTime(.0001,t+dur);
    o.frequency.value=rate; lg.gain.value=depth; o.connect(lg); lg.connect(g.gain);
    s.connect(fl); fl.connect(g); g.connect(master); s.start(t); o.start(t); s.stop(t+dur+.1); o.stop(t+dur+.1);
  }
  bed('lowpass',280,.7,.22,.7,.07); bed('bandpass',2200,.6,.05,7,.025); bed('highpass',5000,.5,.018,11,.01);
  var end=performance.now()+dur*1000;
  var id=setInterval(function(){
    var k=(end-performance.now())/(dur*1000);
    if(k<=0){clearInterval(id);return}
    var peak=Math.sin(Math.min(1,(1-k))*Math.PI), n=rnd()<peak*.95?(rnd()<.5?2:1)+(rnd()<.15?1:0):0;
    for(var i=0;i<n;i++)crackle();
  },40);
}
function sGlassSynth(){
  nz(0,.012,'bandpass',3200,.8,.9,.0005); tn(0,'triangle',900,300,.05,.25);
  nz(.004,.4,'highpass',4200,.6,.5,.001); nz(.01,.25,'bandpass',7000,1.5,.35,.001);
  for(var i=0;i<18;i++){var d=.05+Math.pow(rnd(),1.6)*.9, f=2800+rnd()*6200; tn(d,'sine',f,f*.97,.05+rnd()*.14,.03+rnd()*.07); nz(d,.012,'highpass',6000,.7,.12+rnd()*.15,.0005)}
}
function sWoodSynth(){
  nz(0,.01,'bandpass',2600,.9,.9,.0005); tn(0,'triangle',190,70,.14,.7); tn(0,'sine',95,48,.22,.6);
  nz(0,.18,'bandpass',520,2.2,.7,.001); nz(.012,.09,'bandpass',1500,1.5,.5,.001);
  for(var i=0;i<6;i++){var d=.03+rnd()*.28; nz(d,.02,'bandpass',900+rnd()*2400,3,.2+rnd()*.25,.0008); if(rnd()<.5)tn(d,'triangle',300+rnd()*250,150,.04,.15)}
}
function sBrickSynth(){
  tn(0,'sine',100,28,.55,1); tn(0,'triangle',200,60,.12,.5);
  nz(0,.02,'bandpass',1400,.8,.7,.0005); nz(0,.45,'lowpass',700,.6,.7,.001); nz(.01,.2,'bandpass',2000,.7,.35,.001);
  for(var i=0;i<10;i++){var d=.07+Math.pow(rnd(),1.4)*.55; nz(d,.03+rnd()*.03,'bandpass',300+rnd()*1100,1.8,.12+rnd()*.25,.001); if(rnd()<.4)tn(d,'sine',180+rnd()*200,90,.05,.1)}
}
function sPopSynth(){
  var f=PENT[(rnd()*5)|0]*(.45+rnd()*.1);
  tn(0,'sine',f*2.4,f,.06,.6); tn(0,'sine',f*4.1,f*1.8,.03,.18); nz(0,.012,'bandpass',2800,1.2,.5,.0005); nz(.004,.03,'lowpass',1200,.7,.2,.001);

function loadSamples(){
  if(loading||!AC)return; loading=true;
  Object.keys(SAMPLES).forEach(function(k){
    try{
      var bin=atob(SAMPLES[k].split(',')[1]), u=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      AC.decodeAudioData(u.buffer,function(d){buf[k]=d},function(){});
    }catch(e){}
  });
}
function play(name,rate,gain){
  if(!audio()||!buf[name])return false;
  var s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf[name]; s.playbackRate.value=rate; g.gain.value=gain;
  s.connect(g); g.connect(master); g.connect(rev); s.start(); return true;
}

function fireSound(dur){
  if(!audio()||!buf.fire){fireSynth(dur);return}
  var t=AC.currentTime, s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf.fire; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(1,t+1.2);
  g.gain.setValueAtTime(1,t+dur-2.2); g.gain.linearRampToValueAtTime(.0001,t+dur);
  s.connect(g); g.connect(master); s.start(t,0,dur+.1);
}

var FIRE=['#fff1b0','#ffd35a','#ffb02e','#ff8a1f','#ff5a14','#d93a0c','#a02208','#6a1606'];
function resize(){
  D=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*D); cv.height=Math.round(H*D);
}
window.addEventListener('resize',resize); resize();
function spawn(p){p.t=0; fx.push(p); if(!raf){last=performance.now(); raf=requestAnimationFrame(frame)}}
function frame(now){
  var dt=Math.min(.033,(now-last)/1000); last=now;
  cx.setTransform(D,0,0,D,0,0); cx.clearRect(0,0,W,H); cx.globalCompositeOperation='source-over'; curL=false;
  for(var i=fx.length-1;i>=0;i--){
    var p=fx[i], dead=false; p.t+=dt;
    if(p.k==='burn'){
      if(p.t<p.dl){gco(false);var hh=Math.max(0,1-(p.dl-p.t)/.7); cx.globalAlpha=hh>0?.7+rnd()*.3:1; cx.fillStyle=HEAT[(hh*(HEAT.length-1))|0]; cx.fillRect(p.x+(hh>0?(rnd()-.5)*hh*1.6:0),p.y+(hh>0?(rnd()-.5)*hh:0),p.s,p.s)}
      else{
        var u=(p.t-p.dl)/p.dur;
        if(!p.ig){p.ig=1; if(rnd()<.16)spawn({k:'dot',x:p.x,y:p.y,vx:(rnd()-.5)*40,vy:-70-rnd()*110,g:-90,fr:1.4,z:2+rnd()*3.5,col:FIRE[1+((rnd()*4)|0)],life:.5+rnd()*.6})}
        if(u>=1){dead=true; if(--burning===0)burnDone()}
        else if(u<.5){
          gco(true);var k=u*2; p.y-=p.sp*dt*(1+k); p.x+=(p.vx+Math.sin(p.t*9+p.ph)*40)*dt;
          cx.globalAlpha=1-k*.3; cx.fillStyle=FIRE[(k*(FIRE.length-1))|0];
          var sz=p.s*(1.3-k*.7); cx.fillRect(p.x,p.y,sz,sz);
        }else{
          gco(false);var k2=(u-.5)*2; p.vx*=.98; p.x+=(p.vx*.4+Math.sin(p.t*3+p.ph)*14)*dt; p.y+=(20+k2*60)*dt;
          cx.globalAlpha=(1-k2)*.85; cx.fillStyle='#5b5868'; cx.fillRect(p.x,p.y,p.s*.9,p.s*.9);
        }
      }
    }else if(p.k==='shard'){
      gco(true);p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
      if(p.y>H-4&&p.vy>0){p.y=H-4;p.vy*=-.35;p.vx*=.7}
      var l=p.t/p.life; if(l>=1)dead=true;
      else{
        var c=Math.cos(p.rot),s=Math.sin(p.rot);
        cx.setTransform(c*D,s*D,-s*D,c*D,p.x*D,p.y*D); cx.globalAlpha=1-l*l; cx.fillStyle=p.col;
        if(p.sh===0){cx.beginPath();cx.moveTo(0,-p.z);cx.lineTo(p.z*.8,p.z*.6);cx.lineTo(-p.z*.8,p.z*.6);cx.fill()}
        else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        cx.setTransform(D,0,0,D,0,0);
      }
    }else if(p.k==='scrap'){
      gco(false); p.vy+=55*dt; p.vx*=1-.6*dt; p.x+=(p.vx+Math.sin(p.t*3+p.ph)*38)*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
      var l4=p.t/p.life; if(l4>=1)dead=true;
      else{
        var c4=Math.cos(p.rot),s4=Math.sin(p.rot),z=p.z;
        cx.setTransform(c4*D,s4*D,-s4*D,c4*D,p.x*D,p.y*D);
        if(l4<.3){gco(true);cx.globalAlpha=.4*(1-l4/.3);cx.fillStyle='#ff7a2f';cx.beginPath();cx.arc(0,0,z,0,6.283);cx.fill();gco(false)}
        cx.globalAlpha=l4<.7?1:1-(l4-.7)/.3;
        cx.fillStyle=l4<.12?'#ffe2b0':l4<.3?'#ff8a30':l4<.5?'#3b3430':'#4a4752';
        cx.beginPath();cx.moveTo(-z*.5,-z*.3);cx.lineTo(z*.5,-z*.4);cx.lineTo(z*.4,z*.35);cx.lineTo(-z*.3,z*.45);cx.fill();
        cx.setTransform(D,0,0,D,0,0);
      }
    }else if(p.k==='dot'){
      gco(true);p.vx*=1-p.fr*dt; p.vy*=1-p.fr*dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      var l2=p.t/p.life; if(l2>=1)dead=true;
      else{cx.globalAlpha=1-l2; cx.fillStyle=p.col; cx.beginPath(); cx.arc(p.x,p.y,p.z*(1-l2*.5),0,6.283); cx.fill()}
    }else{
      gco(true);var l3=p.t/p.life; if(l3>=1)dead=true;
      else{
        var e=1-Math.pow(1-l3,3); cx.globalAlpha=(1-l3)*.9; cx.strokeStyle=p.col; cx.lineWidth=3*(1-l3)+.5;
        cx.beginPath(); cx.arc(p.x,p.y,p.r0+(p.r1-p.r0)*e,0,6.283); cx.stroke();
      }
    }
    if(dead){fx[i]=fx[fx.length-1]; fx.pop()}
  }
  cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
  if(fx.length)raf=requestAnimationFrame(frame); else{raf=0; cx.clearRect(0,0,W,H)}
}
function pick(a){return a[(rnd()*a.length)|0]}

/* ---------- Navigation ---------- */
var tabs=[].slice.call(document.querySelectorAll('nav button'));
tabs.forEach(function(b){
  b.addEventListener('click',function(){
    document.body.dataset.room=b.dataset.r;
    if(b.dataset.r==='pop')requestAnimationFrame(function(){if(alive===total)fill()});
    tabs.forEach(function(t){t.setAttribute('aria-selected',t===b)});
    [].forEach.call(document.querySelectorAll('.room'),function(s){s.classList.toggle('on',s.id==='r-'+b.dataset.r)});
  });
});

/* ---------- Room 1: Burner ---------- */
var stage=$('#stage'), BT=3.4, ta=$('#ta'), paper=$('#paper'), after=$('#after'), burnBtn=$('#burn'), note=$('#note'), noteT=0;
var MSGS=['تم تفريغ الشحنة بنجاح.. عقلك أرتاح الآن','تحوّل الثقل إلى رماد.. خذ شهيقاً عميقاً وازفر ببطء','ما كان يضغط عليك صار أخف الآن.. أنت بخير','انتهى الحرق. المساحة التي تركها الهمّ أصبحت لك'];
function say(t){note.textContent=t; clearTimeout(noteT); noteT=setTimeout(function(){note.textContent=''},2400)}
function startBurn(){
  var r=ta.getBoundingClientRect(), w=Math.ceil(r.width), h=Math.ceil(r.height);
  var oc=document.createElement('canvas'); oc.width=w; oc.height=h;
  var c=oc.getContext('2d',{willReadFrequently:true});
  c.font='500 20px Cairo, sans-serif'; c.fillStyle='#fff'; c.textBaseline='middle'; c.direction='rtl'; c.textAlign='right';
  var maxW=w-36, lines=[];
  ta.value.split('\n').forEach(function(par){
    var cur='';
    par.split(' ').forEach(function(word){
      var t=cur?cur+' '+word:word;
      if(cur&&c.measureText(t).width>maxW){lines.push(cur);cur=word}else cur=t;
    });
    lines.push(cur);
  });
  lines.forEach(function(l,i){c.fillText(l,w-18,35+i*34-ta.scrollTop)});
  var d=c.getImageData(0,0,w,h).data, pts=[];
  for(var y=0;y<h;y+=3)for(var x=0;x<w;x+=3)if(d[(y*w+x)*4+3]>120)pts.push(x,y);
  var n=pts.length/2, keep=Math.min(1,2800/Math.max(1,n)), textH=lines.length*34+18;
  for(var i=0;i<n;i++){
    if(rnd()>keep)continue;
    var px=pts[2*i], py=pts[2*i+1]; burning++;
    spawn({k:'burn',x:r.left+px,y:r.top+py,dl:BT*(Math.max(0,(h-py)/h)+.06)/1.06+rnd()*.15,dur:1.5+rnd()*1.6,vx:(rnd()-.5)*50,sp:40+rnd()*130,s:3,ph:rnd()*6.28});
  }
  ta.value=''; ta.classList.add('gone'); paper.classList.add('burning'); burnBtn.disabled=true; runPaper(r);
  if(burning===0)burnDone(); else fireSound(7);
}
function runPaper(r){
  stage.classList.add('burning'); var t0=performance.now();
  (function step(now){
    var k=Math.min(1,(now-t0)/(BT*1000)), b=-.06+k*1.06, ly=r.bottom-b*r.height;
    stage.style.setProperty('--b',b.toFixed(4));
    if(k<1){
      for(var i=0;i<4;i++)spawn({k:'dot',x:r.left+rnd()*r.width,y:ly+(rnd()-.5)*8,vx:(rnd()-.5)*40,vy:-50-rnd()*120,g:-110,fr:1.2,z:2.5+rnd()*4,col:FIRE[1+((rnd()*4)|0)],life:.45+rnd()*.5});
      if(rnd()<.6)spawn({k:'scrap',x:r.left+rnd()*r.width,y:ly,vx:(rnd()-.5)*90,vy:-(70+rnd()*170),rot:rnd()*6.28,vr:(rnd()-.5)*7,z:4+rnd()*8,ph:rnd()*6.28,life:2+rnd()*2.2});
      requestAnimationFrame(step);
    }else stage.classList.remove('burning');
  })(t0);
}
function burnDone(){
  paper.classList.remove('burning'); $('#msg').textContent=pick(MSGS); after.hidden=false;
}
burnBtn.addEventListener('click',function(){
  if(!ta.value.trim()){say('اكتب همّاً أولاً ثم أحرقه.');ta.focus();return}
  audio();
  if(document.activeElement===ta){ta.blur();setTimeout(startBurn,300)}else startBurn();
});
$('#again').addEventListener('click',function(){
  after.hidden=true; stage.style.setProperty('--b','-.06'); ta.classList.remove('gone'); burnBtn.disabled=false; ta.focus();
});

/* ---------- Room 2: Smash ---------- */
var app=$('#app'), smashN=0, sc=$('#sc');
var MILE=[[10,'بداية جيدة.. أخرج المزيد.'],[30,'الكتفان بدآ يرتخيان.'],[60,'خرجت طاقة كبيرة.'],[100,'مئة ضربة. خذ شهيقاً عميقاً الآن.'],[200,'أنت أخف بكثير.. أحسنت.']];
var GL=['rgb(200,235,255)','rgb(255,255,255)','rgb(150,210,255)'];
var WD=['rgb(176,120,70)','rgb(120,78,40)','rgb(210,160,100)'];
var BR=['rgb(190,85,60)','rgb(140,60,45)','rgb(110,52,40)'];
var DUST=['rgb(120,100,90)','rgb(90,80,75)'];
function shardsBurst(x,y,n,cols,o){
  for(var i=0;i<n;i++){
    var a=rnd()*6.283, sp=o.sp[0]+rnd()*(o.sp[1]-o.sp[0]);
    var p={k:'shard',sh:o.sh,x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-180,g:1500,rot:rnd()*6.28,vr:(rnd()-.5)*18,col:pick(cols),life:.9+rnd()*.8};
    if(o.sh===0)p.z=5+rnd()*12; else{p.w=o.w[0]+rnd()*o.w[1];p.h=o.h[0]+rnd()*o.h[1]}
    spawn(p);
  }
}
function dots(x,y,n,cols,z,sp,life,g,fr){
  for(var i=0;i<n;i++){
    var a=rnd()*6.283, s=rnd()*sp;
    spawn({k:'dot',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:g,fr:fr,z:z[0]+rnd()*z[1],col:pick(cols),life:life*(.6+rnd()*.6)});
  }
}
function ring(x,y,r1,col,life){spawn({k:'ring',x:x,y:y,r0:6,r1:r1,col:col,life:life})}
var MAT={
  glass:function(x,y){sGlass();shardsBurst(x,y,34,GL,{sh:0,sp:[120,640]});dots(x,y,14,['rgb(255,255,255)'],[1.5,1.5],500,.6,300,2);ring(x,y,120,'rgb(170,220,255)',.35);return 11},
  wood:function(x,y){sWood();shardsBurst(x,y,24,WD,{sh:1,sp:[100,540],w:[3,4],h:[12,26]});dots(x,y,8,['rgb(200,150,95)'],[2,2],260,.8,200,2);return 9},
  brick:function(x,y){sBrick();shardsBurst(x,y,20,BR,{sh:1,sp:[100,460],w:[6,10],h:[6,10]});dots(x,y,18,DUST,[4,5],220,1.2,40,2.5);ring(x,y,90,'rgb(150,120,100)',.4);return 14}
};
function smash(b,x,y){
  audio();
  var amp=MAT[b.dataset.m](x,y);
  b.style.setProperty('--r',((rnd()*16-8)|0)+'deg'); b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
  app.style.setProperty('--s',amp); app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  vib(b.dataset.m==='brick'?60:35);
  smashN++; sc.textContent=ar(smashN);
  for(var i=0;i<MILE.length;i++)if(MILE[i][0]===smashN)$('#smsg').textContent=MILE[i][1];
}
var items=$('#items');
items.addEventListener('pointerdown',function(e){
  var b=e.target.closest('.item'); if(b){e.preventDefault();smash(b,e.clientX,e.clientY)}
});
items.addEventListener('click',function(e){
  var b=e.target.closest('.item');
  if(b&&e.detail===0){var r=b.getBoundingClientRect();smash(b,r.left+r.width/2,r.top+r.height/2)}
});

/* ---------- Room 3: Pop ---------- */
var grid=$('#grid'), popN=0, alive=0, total=0, HUES=[330,190,35,270,95,8];
function fill(){
  grid.innerHTML=''; var gw=grid.clientWidth-8, gh=grid.clientHeight-8, cell=(gw-50)/6, rows=gh>0?Math.floor((gh+10)/(cell+10)):8, N=Math.max(1,Math.min(10,rows))*6; total=N; alive=N; $('#pmsg').textContent='';
  for(var i=0;i<N;i++){
    var b=document.createElement('button'), h=HUES[(rnd()*HUES.length)|0];
    b.className='bubble grow'; b.dataset.h=h; b.style.setProperty('--h',h); b.style.setProperty('--i',i);
    b.setAttribute('aria-label','فقاعة'); grid.appendChild(b);
  }
}
function pop(b){
  if(!b||!b.classList||!b.classList.contains('bubble')||b.classList.contains('popped'))return;
  b.classList.remove('grow'); b.classList.add('popped');
  var r=b.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2, col='hsl('+b.dataset.h+' 95% 62%)';
  sPop(); vib(8); ring(x,y,r.width*.9,col,.3);
  dots(x,y,12,[col,'rgb(255,255,255)'],[1.5,2.5],320,.55,500,3);
  popN++; alive--; $('#pc').textContent=ar(popN);
  if(alive===0)$('#pmsg').textContent='انفجرت كلها.. خذ نفساً عميقاً ثم انفخ من جديد.';
}
var dragging=false;
grid.addEventListener('pointerdown',function(e){dragging=true;pop(e.target)});
grid.addEventListener('pointermove',function(e){if(dragging)pop(document.elementFromPoint(e.clientX,e.clientY))});
['pointerup','pointercancel','pointerleave'].forEach(function(n){grid.addEventListener(n,function(){dragging=false})});
grid.addEventListener('click',function(e){if(e.detail===0)pop(e.target)});
$('#refill').addEventListener('click',fill);
window.addEventListener('resize',function(){if(document.body.dataset.room==='pop'&&alive===total)fill()});
fill();
})();
</script>
</body>
